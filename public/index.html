<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>forge</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9A%92%3C/text%3E%3C/svg%3E" />
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div class="side-top">
        <div class="mode-switch" role="tablist" aria-label="Mode">
          <button id="mode-chat-btn" class="mode-btn active" data-mode="chat" title="Chat mode" aria-label="Chat mode">
            <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.38 8.38 0 0 1-9 8.4 8.5 8.5 0 0 1-3.8-.9L3 21l1.9-5.2A8.38 8.38 0 0 1 4 11.5 8.5 8.5 0 0 1 12.5 3 8.38 8.38 0 0 1 21 11.5z"/></svg>
          </button>
          <button id="mode-code-btn" class="mode-btn" data-mode="code" title="Code mode" aria-label="Code mode">
            <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
          </button>
        </div>
        <span class="brand-mini"><span class="brand-icon">⚒</span>forge</span>
      </div>

      <div class="search-wrap">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input id="search" type="text" placeholder="Search" spellcheck="false" />
      </div>

      <button id="new-chat" class="nav-item primary"><span class="nav-ico">＋</span><span>New</span></button>
      <button class="nav-item" data-static="projects"><span class="nav-ico">🗂</span><span>Projects</span></button>

      <div class="side-section" id="workspace-section">
        <label class="side-label" for="workspace-input">Workspace</label>
        <div class="workspace-row">
          <input id="workspace-input" type="text" spellcheck="false" placeholder="/path/to/project" />
          <button id="browse-btn" class="btn ghost" title="Browse folders">📁</button>
        </div>
        <div id="workspace-error" class="hint error hidden"></div>
      </div>

      <div class="side-section grow">
        <div id="session-groups" class="scroll-y"></div>
      </div>

      <footer class="side-foot">
        <span class="user-chip"><span id="user-avatar" class="avatar">F</span><span id="user-name">forge</span></span>
        <span class="foot-actions">
          <button id="theme-toggle" title="Toggle theme" aria-label="Toggle theme">◐</button>
          <button id="settings-btn" title="Settings" aria-label="Settings">⚙</button>
        </span>
      </footer>
    </aside>

    <main id="main" class="mode-chat">
      <header id="topbar">
        <div class="topbar-left">
          <span id="top-icon" class="top-icon"></span>
          <h1 id="top-title">New chat</h1>
          <span id="top-dot" class="dot llm-unknown"></span>
          <span id="top-crumbs" class="top-crumbs"></span>
        </div>
        <div class="topbar-right">
          <span id="top-model" class="top-model"></span>
        </div>
      </header>

      <div id="messages" class="scroll-y"></div>
      <button id="scroll-bottom" class="hidden" title="Scroll to bottom" aria-label="Scroll to bottom">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><polyline points="19 12 12 19 5 12"/></svg>
      </button>

      <div id="status-error" class="status-error hidden"></div>

      <div id="composer">
        <div class="composer-box">
          <textarea id="input" rows="1" placeholder="How can I help you today?" spellcheck="false"></textarea>
          <div class="composer-bar">
            <div class="composer-left">
              <span id="mode-wrap" class="mode-wrap">
                <span class="perm-label">Permission</span>
                <select id="mode-select" title="Permission mode">
                  <option value="ask">Ask</option>
                  <option value="auto-edit">Auto-edit</option>
                  <option value="full">Full access</option>
                </select>
              </span>
              <span id="status-tokens" class="status-tokens hidden"></span>
            </div>
            <div class="composer-right">
              <span id="status-llm" class="status-llm llm-unknown" title="LLM server reachability">●</span>
              <button id="send-btn" class="send-btn" title="Send (Enter)" aria-label="Send">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>
              </button>
              <button id="stop-btn" class="stop-btn hidden" title="Stop (Esc)" aria-label="Stop">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
              </button>
            </div>
          </div>
        </div>
        <p class="composer-note">forge can make mistakes. Double-check important information.</p>
      </div>
    </main>
  </div>

  <dialog id="settings-modal">
    <form method="dialog" id="settings-form">
      <h2>Settings</h2>
      <label>Base URL<input id="set-baseurl" type="text" spellcheck="false" /></label>
      <label>API key<input id="set-apikey" type="password" spellcheck="false" placeholder="unchanged" /><span class="hint" id="set-apikey-hint"></span></label>
      <label>Model<input id="set-model" type="text" spellcheck="false" /></label>
      <div class="row">
        <label>Max steps<input id="set-maxsteps" type="number" min="1" max="500" /></label>
        <label>Context limit (tokens)<input id="set-contextlimit" type="number" min="4000" step="1000" /></label>
      </div>
      <p class="hint">Environment variables FORGE_BASE_URL / FORGE_API_KEY / FORGE_MODEL override these.</p>
      <menu>
        <button value="cancel" class="btn ghost">Cancel</button>
        <button value="save" class="btn primary" id="settings-save">Save</button>
      </menu>
      <div id="settings-msg" class="hint"></div>
    </form>
  </dialog>

  <dialog id="browse-modal">
    <div class="browse-head">
      <strong>Choose project folder</strong>
      <button id="browse-close" class="btn ghost">✕</button>
    </div>
    <div id="browse-path" class="browse-path"></div>
    <div id="browse-list" class="scroll-y"></div>
    <menu>
      <button id="browse-up" class="btn ghost">↑ Up</button>
      <span class="spacer"></span>
      <button id="browse-choose" class="btn primary">Use this folder</button>
    </menu>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
